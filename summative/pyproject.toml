[project]
name = "alu-africa-youth-income"
version = "1.0.0"
description = "African youth career income model, FastAPI service, and Flutter client."
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1",
    "joblib>=1.5.0,<2",
    "numpy>=2.2.0,<2.5",
    "pandas>=2.3.0,<3",
    "pydantic>=2.11.0,<3",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.7.0,<2",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.0,<2",
    "matplotlib>=3.10.0,<4",
    "seaborn>=0.13.0,<1",
]
