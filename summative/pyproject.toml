[project]
name = "alu-africa-graduate-launch"
version = "1.0.0"
description = "African graduate pathway regression model, FastAPI service, and Flutter client."
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "joblib>=1.5.0,<2",
    "numpy>=2.2.0,<2.5",
    "pandas>=2.3.0,<3",
    "pydantic>=2.11.0,<3",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.7.0,<2",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.0,<2",
    "matplotlib>=3.10.0,<4",
    "nbclient>=0.10.0,<1",
    "nbformat>=5.10.0,<6",
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
    "seaborn>=0.13.0,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
